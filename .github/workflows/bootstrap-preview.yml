name: Bootstrap Aria Preview

on:
  push:
    paths:
      - '.github/workflows/bootstrap-preview.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: 2.48.2-preview.25
      ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-62ec-81f4-9aaa-54b017ee6d7b/raw?se=2026-08-20T19%3A29%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=edc4d466-e592-5ad1-be63-9664e63aeaa1&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-19T23%3A49%3A29Z&ske=2026-08-20T23%3A49%3A29Z&sks=b&skv=2026-02-06&sig=gd8p1zJYxSytpKTbtQupeXUkJBhMJxKwjE19DfZTRYk%3D'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Download validated Preview artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/aria-preview.zip
          mkdir -p /tmp/aria-preview
          unzip -q /tmp/aria-preview.zip -d /tmp/aria-preview
          ls -lh /tmp/aria-preview

      - name: Publish GitHub prerelease
        run: |
          set -euo pipefail
          ARM="/tmp/aria-preview/Aria-${VERSION}-Apple-Silicon.dmg"
          X64="/tmp/aria-preview/Aria-${VERSION}-Intel.dmg"
          test -f "$ARM"
          test -f "$X64"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$ARM" "$X64" --clobber
          else
            gh release create "v${VERSION}" "$ARM" "$X64" \
              --prerelease \
              --title "Aria ${VERSION}" \
              --notes "Preview validée automatiquement pour tester la mise à jour intégrée d'Aria."
          fi

      - name: Point Preview updater to this release
        run: |
          set -euo pipefail
          ARM="/tmp/aria-preview/Aria-${VERSION}-Apple-Silicon.dmg"
          X64="/tmp/aria-preview/Aria-${VERSION}-Intel.dmg"
          ARM_SHA=$(sha256sum "$ARM" | awk '{print $1}')
          X64_SHA=$(sha256sum "$X64" | awk '{print $1}')
          ARM_SIZE=$(stat -c%s "$ARM")
          X64_SIZE=$(stat -c%s "$X64")
          export ARM_SHA X64_SHA ARM_SIZE X64_SIZE
          node - <<'NODE'
          const fs = require('fs')
          const version = process.env.VERSION
          const manifest = {
            version,
            releaseDate: new Date().toISOString().slice(0, 10),
            minimumVersion: '2.48.1',
            notes: 'Test de mise à jour automatique : Aria doit télécharger, vérifier, se remplacer et redémarrer sans glisser manuellement l’application.',
            downloads: {
              arm64: {
                url: `https://github.com/hfioafio/Aria-Downloads/releases/download/v${version}/Aria-${version}-Apple-Silicon.dmg`,
                sha256: process.env.ARM_SHA,
                size: Number(process.env.ARM_SIZE)
              },
              x64: {
                url: `https://github.com/hfioafio/Aria-Downloads/releases/download/v${version}/Aria-${version}-Intel.dmg`,
                sha256: process.env.X64_SHA,
                size: Number(process.env.X64_SIZE)
              }
            }
          }
          fs.writeFileSync('updates/preview.json', JSON.stringify(manifest, null, 2) + '\n')
          NODE
          git config user.name "Aria Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add updates/preview.json
          git commit -m "preview: publish ${VERSION} for in-app update test"
          git push origin main

# bootstrap trigger preview.25
